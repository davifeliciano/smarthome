- id: '1789945469749'
  alias: 'Banheiro: Controle do Exaustor pelo Chuveiro'
  description: Liga o exaustor ao detectar consumo e desliga 5 minutos após o banho.
  triggers:
  - entity_id: sensor.chuveiro_power
    above: 100
    id: ligar_exaustor
    trigger: numeric_state
  - entity_id: sensor.chuveiro_power
    below: 50
    for:
      hours: 0
      minutes: 5
      seconds: 0
    id: desligar_exaustor
    trigger: numeric_state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: ligar_exaustor
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.interruptor_do_banheiro_l2
    - conditions:
      - condition: trigger
        id: desligar_exaustor
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.interruptor_do_banheiro_l2
  mode: restart
- id: '1789949824252'
  alias: 'Luz do Banheiro: Paralelo Virtual'
  description: Sincroniza o estado de dois interruptores com redundância de pacotes.
  triggers:
  - entity_id:
    - switch.interruptor_do_banheiro_l1
    - switch.interruptor_central_l6
    to: 'on'
    id: ligar
    trigger: state
  - entity_id:
    - switch.interruptor_do_banheiro_l1
    - switch.interruptor_central_l6
    to: 'off'
    id: desligar
    trigger: state
  conditions:
  - condition: template
    value_template: '{{ states(''switch.interruptor_do_banheiro_l1'') != states(''switch.interruptor_central_l6'')
      }}

      '
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: ligar
      sequence:
      - repeat:
          sequence:
          - action: switch.turn_on
            target:
              entity_id:
              - switch.interruptor_do_banheiro_l1
              - switch.interruptor_central_l6
          - delay:
              seconds: 2
          until:
          - condition: template
            value_template: '{{ states(''switch.interruptor_do_banheiro_l1'') == ''on''
              and states(''switch.interruptor_central_l6'') == ''on'' or repeat.index
              >= 3 }}

              '
    - conditions:
      - condition: trigger
        id: desligar
      sequence:
      - repeat:
          sequence:
          - action: switch.turn_off
            target:
              entity_id:
              - switch.interruptor_do_banheiro_l1
              - switch.interruptor_central_l6
          - delay:
              seconds: 2
          until:
          - condition: template
            value_template: '{{ states(''switch.interruptor_do_banheiro_l1'') == ''off''
              and states(''switch.interruptor_central_l6'') == ''off'' or repeat.index
              >= 3 }}

              '
  mode: restart
