- id: '1790028781032'
  alias: 'Luz da Cozinha: Intermediário Virtual'
  description: Sincroniza 3 interruptores com alvo inteligente e sem bloqueios.
  triggers:
  - entity_id:
    - switch.interruptor_central_l1
    - switch.interruptor_da_cozinha_l2
    - switch.interruptor_da_entrada_l2
    from: 'off'
    to: 'on'
    trigger: state
  - entity_id:
    - switch.interruptor_central_l1
    - switch.interruptor_da_cozinha_l2
    - switch.interruptor_da_entrada_l2
    from: 'on'
    to: 'off'
    trigger: state
  conditions:
  - condition: template
    value_template: '{% set s1 = states(''switch.interruptor_central_l1'') %} {% set
      s2 = states(''switch.interruptor_da_cozinha_l2'') %} {% set s3 = states(''switch.interruptor_da_entrada_l2'')
      %} {{ not (s1 == s2 == s3) }}

      '
  actions:
  - repeat:
      sequence:
      - variables:
          alvo_estado: '{{ trigger.to_state.state }}'
          entidades:
          - switch.interruptor_central_l1
          - switch.interruptor_da_cozinha_l2
          - switch.interruptor_da_entrada_l2
          alvos_desatualizados: '{{ expand(entidades) | selectattr(''state'', ''!='',
            alvo_estado) | map(attribute=''entity_id'') | list }}

            '
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ alvos_desatualizados | length > 0 }}'
          sequence:
          - action: switch.turn_{{ alvo_estado }}
            target:
              entity_id: '{{ alvos_desatualizados }}'
      - delay:
          seconds: 2
      until:
      - condition: template
        value_template: '{% set alvo_estado = trigger.to_state.state %} {% set entidades
          = [''switch.interruptor_central_l1'', ''switch.interruptor_da_cozinha_l2'',
          ''switch.interruptor_da_entrada_l2''] %} {{ expand(entidades) | selectattr(''state'',
          ''!='', alvo_estado) | list | length == 0 or repeat.index >= 3 }}

          '
  mode: restart
