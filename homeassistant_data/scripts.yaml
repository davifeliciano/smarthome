  description: Liga a iluminação principal do apartamento.
  icon: mdi:lightbulb
ativar_modo_de_som_musica:
  alias: Ativar Modo de Som Música
  description: Ativa modo de som música na Soundbar JBL
  icon: mdi:music
  mode: single
  sequence:
  - action: mqtt.publish
    data:
      topic: zigbee2mqtt/Emissor IR/set
      payload: '{"ir_code_to_send": "CVgjghE+AnUGPgKAAQFnAkALQANAAUAHQAPAAcALBHUGZwI+4AIBA3UGPgJAAUAHAXUGQBsFZwJ1Bj4C4AMB4AMPwAtABwt1Bj4CoqBYI7MIPgI="}'
ativar_modo_de_som_cinema:
  sequence:
  - action: mqtt.publish
    data:
      topic: zigbee2mqtt/Emissor IR/set
      payload: '{"ir_code_to_send": "CVojnRE/AnsGPwLAAUALQANAAUAHQAPAAcALwAfgAwFAE+ADA0ABQA9AAcAH4AMBwBMLewY/AqCgWiO0CD8C"}'
  alias: Ativar Modo de Som Cinema
  description: Ativa modo de som cinema na Soundbar JBL
  icon: mdi:movie
  mode: single
ativar_modo_de_som_tv:
  sequence:
  - action: mqtt.publish
    data:
      topic: zigbee2mqtt/Emissor IR/set
      payload: '{"ir_code_to_send": "CW8jjRFAAnoGQALAAUALQANAAUAHQAPAAcALwAfgAwFAE8ADQAFAC8AB4AMLQAHAD0AHC3oGQAKYoG8jowhAAg=="}'
  alias: Ativar Modo de Som TV
  description: Ativa modo de som TV na Soundbar JBL
  icon: mdi:television
  mode: single
ligar_soundbar:
  sequence:
  - action: mqtt.publish
    data:
      topic: zigbee2mqtt/Emissor IR/set
      payload: '{"ir_code_to_send": "CXYjbBFBAnYGQQLAAUALQANAAUAHQAMEQQJhAkEgAYALAUECwAfAAcAPQAdAA0ABQAdAA8AB4BMLB7ugdiO2CEEC"}'
  alias: Ligar Soundbar
  description: Liga ou Desliga Soundbar JBL
  icon: mdi:toggle-switch
  mode: single
mutar_tv_da_sala:
  sequence:
  - action: remote.send_command
    target:
      entity_id: remote.sala_de_estar_tv
    data:
      command: MUTE
  description: Ativa ou Desativa Mudo da TV
  icon: mdi:volume-mute
  mode: single
  alias: Mutar TV da Sala
pausa_tv:
  sequence:
  - action: remote.send_command
    target:
      entity_id: remote.sala_de_estar_tv
    data:
      command: MEDIA_PLAY_PAUSE
  description: Pausa ou continua conteúdo reproduzindo na TV
  icon: mdi:play-pause
  mode: single
  alias: Pausa TV
diminui_volume_da_tv:
  sequence:
  - action: remote.send_command
    target:
      entity_id: remote.sala_de_estar_tv
    data:
      command: VOLUME_DOWN
  description: Diminui o volume da TV
  icon: mdi:play-pause
  mode: single
  alias: Diminui Volume da TV
aumenta_volume_da_tv:
  sequence:
  - action: remote.send_command
    target:
      entity_id: remote.sala_de_estar_tv
    data:
      command: VOLUME_UP
  description: Aumenta o volume da TV
  icon: mdi:volume-plus
  mode: single
  alias: Aumenta Volume da TV
ligar_ou_desligar_tv:
  sequence:
  - action: remote.toggle
    target:
      entity_id: remote.sala_de_estar_tv
  alias: Ligar ou Desligar TV
  description: Liga ou Desliga a TV
  icon: mdi:power
