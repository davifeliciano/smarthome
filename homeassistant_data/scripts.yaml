    target:
      device_id: d34d1b7385b2cd2015cf6ab3d6417976
    data: {}
  - action: switch.turn_off
    metadata: {}
    target:
      entity_id: switch.interruptor_da_entrada_l1
    data: {}
  alias: Desligar Todas as Luzes
  description: Desliga toda a iluminação do apartamento
  icon: mdi:lightbulb-off
